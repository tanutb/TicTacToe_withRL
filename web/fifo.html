<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4×4 FIFO Tic Tac Toe</title>
  <meta name="description" content="4×4 tic tac toe where each player keeps only four marks, against Q-Learning, SARSA and Double Q agents.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f6f8fb'/%3E%3Cpath d='M8 8l16 16M24 8L8 24' stroke='%232449c8' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fifo.css">
  <script type="module" src="js/fifo/main.js"></script>
</head>
<body class="fifo-page">
  <header class="top">
    <span class="logo">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8l16 16M24 8L8 24" /></svg>
      4×4 FIFO
    </span>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button id="tab-play" role="tab" aria-controls="panel-play" aria-selected="true" type="button">Play</button>
      <button id="tab-results" role="tab" aria-controls="panel-results" aria-selected="false" tabindex="-1" type="button">Results</button>
      <button id="tab-learn" role="tab" aria-controls="panel-learn" aria-selected="false" tabindex="-1" type="button">How it works</button>
    </nav>

    <div class="top-right">
      <a class="text-link" href="index.html">← 3×3 game</a>
      <a class="icon-button" href="https://github.com/tanutb/TicTacToe_withRL" aria-label="Source code on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      </a>
      <button id="theme" class="icon-button" type="button" aria-label="Switch to dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="panel-play" class="fifo" role="tabpanel" aria-labelledby="tab-play"></section>
    <section id="panel-results" class="results" role="tabpanel" aria-labelledby="tab-results" hidden></section>
    <section id="panel-learn" class="learn" role="tabpanel" aria-labelledby="tab-learn" hidden></section>
  </main>
</body>
</html>
